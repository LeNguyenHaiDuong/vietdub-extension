<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VietDub - Control Center</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="popup-header">
      <div class="brand">
        <img src="../icons/icon48.png" alt="VietDub" class="brand-icon">
        <div class="brand-text">
          <h1 class="brand-title">VietDub</h1>
          <span class="brand-subtitle">AI Video Dubbing</span>
        </div>
      </div>
      <!-- Master Switch -->
      <label class="switch" title="Bật/Tắt Lồng tiếng">
        <input type="checkbox" id="masterToggle" checked>
        <span class="slider"></span>
      </label>
    </header>

    <!-- Status Banner -->
    <div class="status-banner" id="statusBanner">
      <span class="status-dot"></span>
      <span class="status-text" id="statusText">Đang kích hoạt trên video</span>
    </div>

    <!-- Main Content -->
    <main class="popup-body">
      <!-- Section 1: Voice & Engine -->
      <div class="control-group" id="ttsGroup">
        <div class="label-row">
          <div class="label-with-switch">
            <label class="group-label" for="enableTTSToggle">Lồng tiếng (TTS)</label>
            <label class="switch-sm" title="Bật/Tắt giọng đọc lồng tiếng">
              <input type="checkbox" id="enableTTSToggle" checked>
              <span class="slider-sm"></span>
            </label>
          </div>
          <span class="badge-studio" id="voiceQualityBadge">✨ Studio 24kHz</span>
        </div>
        <div class="select-wrapper" id="ttsSelectWrapper">
          <select id="voiceSelect" class="styled-select">
            <option value="vi-VN-HoaiMyNeural">🌟 Hoài My (Nữ - Truyền cảm VTV)</option>
            <option value="vi-VN-NamMinhNeural">🌟 Nam Minh (Nam - Trầm ấm chuyên nghiệp)</option>
          </select>
          <button type="button" id="testVoiceBtn" class="action-btn" title="Nghe thử giọng">
            🔊 Thử giọng
          </button>
        </div>
      </div>

      <!-- Section 2: Audio & Ducking Controls -->
      <div id="ttsSlidersGroup">
        <div class="control-group">
          <div class="slider-row">
            <label class="slider-label" for="dubbingVolume">Âm lượng lồng tiếng</label>
            <span class="slider-val" id="dubbingVolumeVal">100%</span>
          </div>
          <input type="range" id="dubbingVolume" min="0" max="100" value="100" class="styled-range">
        </div>

        <div class="control-group" style="margin-top: 6px;">
          <div class="slider-row">
            <label class="slider-label" for="duckingRatio">Giảm âm video gốc khi nói</label>
            <span class="slider-val" id="duckingRatioVal">25%</span>
          </div>
          <input type="range" id="duckingRatio" min="5" max="50" value="25" class="styled-range">
          <span class="hint-text">Tự động hạ âm lượng video gốc khi lồng tiếng nói</span>
        </div>

        <div class="control-group" style="margin-top: 6px;">
          <div class="slider-row">
            <label class="slider-label" for="speechRate">Tốc độ đọc cơ bản</label>
            <span class="slider-val" id="speechRateVal">1.05x</span>
          </div>
          <input type="range" id="speechRate" min="80" max="180" value="105" step="5" class="styled-range">
        </div>
      </div>

      <!-- Section 3: Feature Toggles -->
      <div class="toggles-grid">
        <label class="toggle-card" id="cardTTSToggle">
          <div class="toggle-info">
            <span class="toggle-name">Lồng tiếng (TTS)</span>
            <span class="toggle-desc">Thuyết minh giọng AI</span>
          </div>
          <input type="checkbox" id="enableTTSToggleCard" checked>
          <span class="checkbox-visual"></span>
        </label>

        <label class="toggle-card">
          <div class="toggle-info">
            <span class="toggle-name">Phụ đề song ngữ</span>
            <span class="toggle-desc">Hiển thị phụ đề Anh - Việt</span>
          </div>
          <input type="checkbox" id="showSubtitlesToggle" checked>
          <span class="checkbox-visual"></span>
        </label>

        <label class="toggle-card toggle-card-full">
          <div class="toggle-info">
            <span class="toggle-name">Tự đồng bộ tốc độ</span>
            <span class="toggle-desc">Tự động khớp thời lượng câu nói với video</span>
          </div>
          <input type="checkbox" id="autoRateToggle" checked>
          <span class="checkbox-visual"></span>
        </label>
      </div>

      <!-- Section 4: Advanced Dropdown -->
      <details class="advanced-section">
        <summary class="advanced-summary">Tùy chỉnh nâng cao &amp; API AI</summary>
        <div class="advanced-body">
          <div class="control-group">
            <label class="group-label" for="ttsEngineSelect">Cơ chế âm thanh (Engine)</label>
            <select id="ttsEngineSelect" class="styled-select">
              <option value="auto">✨ Tự động (Ưu tiên giọng Studio Neural 24kHz)</option>
              <option value="edge-neural">🌟 Microsoft Edge Neural (Cực tự nhiên - Miễn phí 100%)</option>
              <option value="openai">🤖 OpenAI TTS (Dùng OpenAI API Key cá nhân)</option>
              <option value="chrome-tts">🖥️ Native Chrome TTS (Hệ thống máy tính)</option>
              <option value="google-stream">🌐 Google Stream (Dự phòng)</option>
              <option value="web-speech">🗣️ Web Speech API</option>
            </select>
          </div>

          <!-- OpenAI API Key configuration (visible when OpenAI selected or configured) -->
          <div class="control-group" id="openaiConfigGroup">
            <label class="group-label" for="openaiApiKeyInput">OpenAI API Key (Tùy chọn)</label>
            <input type="password" id="openaiApiKeyInput" placeholder="sk-..." class="styled-input" autocomplete="off">
            <span class="hint-text">Dùng OpenAI TTS-1 Nova/Alloy cho độ chân thực cao nhất</span>
          </div>

          <div class="control-group" id="openaiVoiceGroup">
            <label class="group-label" for="openaiVoiceSelect">Giọng OpenAI</label>
            <select id="openaiVoiceSelect" class="styled-select">
              <option value="nova">Nova (Nữ - Truyền cảm, tự nhiên nhất)</option>
              <option value="alloy">Alloy (Trung tính, chuẩn mực)</option>
              <option value="shimmer">Shimmer (Nữ - Trong trẻo)</option>
              <option value="onyx">Onyx (Nam - Trầm ấm, dõng dạc)</option>
              <option value="echo">Echo (Nam - Rõ ràng)</option>
            </select>
          </div>

          <div class="control-group">
            <label class="group-label" for="subtitlePosSelect">Vị trí phụ đề</label>
            <select id="subtitlePosSelect" class="styled-select">
              <option value="bottom">Phía dưới video (Bottom)</option>
              <option value="top">Phía trên video (Top)</option>
            </select>
          </div>

          <div class="control-group">
            <div class="slider-row">
              <label class="slider-label" for="fontSizeRange">Cỡ chữ phụ đề</label>
              <span class="slider-val" id="fontSizeVal">18px</span>
            </div>
            <input type="range" id="fontSizeRange" min="14" max="28" value="18" class="styled-range">
          </div>
        </div>
      </details>
    </main>

    <!-- Footer Stats -->
    <footer class="popup-footer">
      <div class="footer-stat">
        <span class="stat-icon">🎓</span>
        <span>Coursera • LinkedIn • Udemy • YouTube</span>
      </div>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
